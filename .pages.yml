media:
  - name: images
    label: Images
    input: public/content/images
    output: /media/images
    categories: [image]
    # actions:
    #   - name: optimize-images
    #     label: Optimize images
    #     workflow: pages-cms-media-action.yml
  - name: videos
    label: Vidéos
    input: public/content/videos
    output: /media/videos
    categories: [video]

content:
  # PREMIÈRE COLLECTION : PROJETS
  - name: projects
    label: Mes Projets
    type: collection
    path: src/content/projects
    fields:
      - name: title
        label: Titre
        type: string
      - name: body
        label: Description
        type: rich-text
      - name: video
        label: url vidéo
        type: string
        required: false
      - name: images
        label: Images
        type: image
        options:
          media: images
        list: true
      - name: published
        label: Publié ?
        type: boolean
        default: true
